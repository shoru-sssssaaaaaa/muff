name: MUFF
options:
  bundleIdPrefix: com.muff
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  Nuke:
    url: https://github.com/kean/Nuke
    from: "12.0.0"
  FeedKit:
    url: https://github.com/nmdias/FeedKit
    from: "9.1.2"

targets:
  MUFF:
    type: application
    platform: iOS
    sources:
      - MUFF
    resources:
      - path: MUFF/Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: MUFF/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.muff.app
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GRDB
      - package: Nuke
        product: NukeUI
      - package: Nuke
      - package: FeedKit

  MUFFTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MUFFTests
    dependencies:
      - target: MUFF
    settings:
      base:
        INFOPLIST_FILE: ""
