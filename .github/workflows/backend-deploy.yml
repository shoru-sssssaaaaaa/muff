name: Backend Build and Deploy

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

env:
  REGISTRY: asia-northeast1-docker.pkg.dev
  IMAGE: asia-northeast1-docker.pkg.dev/strange-victory-451001-e8/mttm/backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: development

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build Docker image
        working-directory: backend
        run: |
          docker build \
            --build-arg PORT=${{ vars.PORT }} \
            --build-arg DATABASE_URL=${{ vars.DATABASE_URL }} \
            --build-arg DATABASE_USER=${{ secrets.DATABASE_USER }} \
            --build-arg DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
            --build-arg DATABASE_MAX_POOL_SIZE=${{ vars.DATABASE_MAX_POOL_SIZE }} \
            --build-arg CORS_ALLOWED_HOSTS=${{ vars.CORS_ALLOWED_HOSTS }} \
            --build-arg RSS_POLLING_INTERVAL_MINUTES=${{ vars.RSS_POLLING_INTERVAL_MINUTES }} \
            --build-arg POPULARITY_AGGREGATION_INTERVAL_MINUTES=${{ vars.POPULARITY_AGGREGATION_INTERVAL_MINUTES }} \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy non-prod-muff-back \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=asia-northeast1 \
            --platform=managed \
            --allow-unauthenticated \
            --add-cloudsql-instances=strange-victory-451001-e8:asia-northeast1:muff-trial-non-prod
