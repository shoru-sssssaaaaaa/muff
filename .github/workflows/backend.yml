name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle.kts', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew ktlintCheck

      - name: Build
        run: ./gradlew build -x test

      - name: Test
        run: ./gradlew test

  docker-build:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: backend
        run: |
          docker build \
            --build-arg PORT=${{ vars.PORT }} \
            --build-arg DATABASE_URL=${{ vars.DATABASE_URL }} \
            --build-arg DATABASE_USER=${{ secrets.DATABASE_USER }} \
            --build-arg DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
            --build-arg DATABASE_MAX_POOL_SIZE=${{ vars.DATABASE_MAX_POOL_SIZE }} \
            --build-arg CORS_ALLOWED_HOSTS=${{ vars.CORS_ALLOWED_HOSTS }} \
            --build-arg RSS_POLLING_INTERVAL_MINUTES=${{ vars.RSS_POLLING_INTERVAL_MINUTES }} \
            --build-arg POPULARITY_AGGREGATION_INTERVAL_MINUTES=${{ vars.POPULARITY_AGGREGATION_INTERVAL_MINUTES }} \
            -t mttm-backend:develop \
            .
