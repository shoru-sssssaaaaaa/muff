services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: muff
      POSTGRES_USER: muff
      POSTGRES_PASSWORD: muff
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muff"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "jdbc:postgresql://db:5432/muff"
      DATABASE_USER: muff
      DATABASE_PASSWORD: muff
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
