ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [com.muff.ApplicationKt.module]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/muff"
    url = ${?DATABASE_URL}
    user = "muff"
    user = ${?DATABASE_USER}
    password = "muff"
    password = ${?DATABASE_PASSWORD}
    maxPoolSize = 10
    maxPoolSize = ${?DATABASE_MAX_POOL_SIZE}
}

cors {
    allowedHosts = "localhost:3000,127.0.0.1:3000"
    allowedHosts = ${?CORS_ALLOWED_HOSTS}
}

jobs {
    rssPollingIntervalMinutes = 10
    rssPollingIntervalMinutes = ${?RSS_POLLING_INTERVAL_MINUTES}
    popularityAggregationIntervalMinutes = 30
    popularityAggregationIntervalMinutes = ${?POPULARITY_AGGREGATION_INTERVAL_MINUTES}
}

appAttest {
    teamId = "XXXXXXXXXX"
    teamId = ${?APP_ATTEST_TEAM_ID}
    bundleId = "com.muff.MUFF"
    bundleId = ${?APP_ATTEST_BUNDLE_ID}
    enforcePost = true
    enforcePost = ${?APP_ATTEST_ENFORCE_POST}
    enforceAll = false
    enforceAll = ${?APP_ATTEST_ENFORCE_ALL}
    challengeTtlSeconds = 300
    challengeTtlSeconds = ${?APP_ATTEST_CHALLENGE_TTL_SECONDS}
}
